name: account_book
description: A high-end Account Book & Debt Manager app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  isar: any
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.1
  pdf: ^3.11.3
  excel: ^4.0.1
  share_plus: ^12.0.1
  intl: ^0.20.2
  printing: ^5.14.2
  local_auth: ^2.3.0
  flutter_native_splash: ^2.4.4
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  flutter_contacts: ^1.1.7+1
  permission_handler: ^11.3.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  image_picker: ^1.0.7

dev_dependencies:
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

  android_12:
    color: "#FFFFFF"
    image: assets/images/logo.png
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
